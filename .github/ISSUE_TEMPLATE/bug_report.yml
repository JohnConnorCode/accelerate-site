name: Bug report
description: Report a reproducible product or developer-experience defect using fictional data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities or include customer data and credentials here. Follow SECURITY.md instead.
  - type: textarea
    id: outcome
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is a problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the issue.
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or deployment
      description: Commit SHA, deployment identity, or `main`.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, viewport, operating system, and local or deployed context. Do not paste environment variables.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This report contains no credentials, private customer data, or undisclosed vulnerability details.
          required: true
