name: CI

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Superseded PR runs can stop. Merge-queue/main receipts remain SHA-specific.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: dependencies
        run: npm ci

      - name: Verify repository hygiene
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:oss

      - name: Verify architecture contract
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:agent-contract

      - name: Verify admin AI operation inventory
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node --test scripts/test-admin-ai-inventory.mjs
          node scripts/admin-ai-inventory.mjs --check

      - name: Verify admin route inventory
        run: npm run test:admin-route-inventory

      - name: Verify copy guardrails
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:guardrails

      - name: Verify no fabricated claims
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:no-fabricated-claims

      - name: Verify house style (no em dashes)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:house-style-copy

      - name: Verify open-source page stats match the repo
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:open-source-stats

      - name: Verify admin design token contract
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:admin-tokens

      - name: Verify docs manifest and prose contract
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:docs

      - name: Verify documentation coverage failure cases
        run: npm run test:docs-coverage

      - name: Verify generated docs llms index is current
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run docs:llms:check

      - name: Verify extension manifests are in sync
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:extensions

      - name: Verify module contract resolves
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:module-contract

      - name: Verify module-owned API routes gate by module
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:module-route-guards

      - name: Verify integration adapters resolve through the registry
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:integration-adapter-encapsulation

      - name: Verify capabilities cannot reach a raw database handle
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:capability-isolation

      - name: Verify module settings never look like secrets
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:module-settings

      - name: Verify runtime tenant and domain boundaries
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          npm run verify:runtime-boundaries
          node --test scripts/test-runtime-error-adoption.mjs

      - name: Verify admin language and route identity
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node scripts/audit-admin-language.mjs --check
          node --import tsx scripts/test-admin-language.ts

      - name: Lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run lint -- --max-warnings=0

      - name: Typecheck all application and test sources
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npx tsc --noEmit

      - name: Check formatting
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run format:check

      - name: Verify documentation search
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:search

      - name: Verify shared navigation contracts
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npx tsx scripts/test-navigation-runtime.ts

      - name: Run core contract suite
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:core

      - name: Measure independent cold plugin evaluations
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          git fetch --no-tags --depth=1 origin 318b11dd00e91043a1218d34766442e778ac0dfc
          npm run test:plugin-cold-start -- --baseline-ref 318b11dd00e91043a1218d34766442e778ac0dfc --output /tmp/plugin-cold-start.json

      - name: Retain all cold-start samples
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-cold-start-measurements
          path: /tmp/plugin-cold-start.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify guided installation contracts
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:setup-status

      - name: Verify fresh-fork install runbook
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:install-runbook

      - name: Verify neutral fork distribution
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:neutral-runtime-distribution && node scripts/test-neutral-export.mjs

      - name: Retain install-runbook receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: install-runbook-receipt
          path: /tmp/accelerate-install-runbook.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify real command-agent orchestration
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:agent-loop

      - name: Verify runtime PostgreSQL concurrency and migrations
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
          PATH="$(pg_config --bindir):$PATH" npm run test:tenant-lifecycle:postgres
          PATH="$(pg_config --bindir):$PATH" npm run test:runtime-postgres
          PATH="$(pg_config --bindir):$PATH" npm run test:work-completion:postgres
          PATH="$(pg_config --bindir):$PATH" npm run test:work-board-resume
          PATH="$(pg_config --bindir):$PATH" npm run test:today-workspace

      - name: Verify Social Marketing adapter and publication transactions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          npm run test:social-postiz
          PATH="$(pg_config --bindir):$PATH" npm run test:social-postgres

      - name: Verify installation migrations
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          npm run verify:migrations
          PATH="$(pg_config --bindir):$PATH" npm run test:migration-ledger
          npm run test:public-roadmap
          PATH="$(pg_config --bindir):$PATH" COLLECTIONS_REMINDER_POSTGRES_PROOF=1 npm run test:collections-lifecycle
          npm run test:collections-reminders

      - name: Verify developer handoff and fresh-clone pickup
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          npm run test:developer-handoff
          npm run test:agent-checkpoint
          NODE_OPTIONS=--conditions=react-server node --import tsx scripts/test-demo-work-continuity.ts

      - name: Verify resource gate behavior
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:resources

      - name: Verify commit workflow behavior
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:verification-workflow

      - name: Verify canonical stage history
        run: |
          NODE_OPTIONS=--conditions=react-server node --import tsx scripts/test-stage-history-analytics.ts
          npm run test:analytics-decision-model

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore Next.js compiler cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-
      # next build includes TypeScript validation. Never ignore build errors.
      - name: Build and typecheck
        run: npm run build

      - name: Verify complete built documentation coverage
        run: npm run verify:public-prerender

      - name: Verify deployable plugin engine package
        run: node scripts/check-plugin-host-package.mjs

      - name: Install browser for first-run verification
        run: npx playwright install --with-deps chromium
      - name: Verify credential-free first-run journey
        env:
          # NextURL canonicalizes loopback IPs to localhost. Keep the server's
          # initURL on that same origin so demo rewrites never become self-proxies.
          PLAYWRIGHT_BASE_URL: http://localhost:3018
        run: |
          setsid npm run start -- --hostname localhost --port 3018 > /tmp/accelerate-first-run-server.log 2>&1 &
          server_pid=$!
          trap 'kill -TERM -- -"$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$PLAYWRIGHT_BASE_URL/roadmap" > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/accelerate-first-run-server.log; exit 1; fi
          # Each browser owns isolated contexts and fictional session state.
          # Run every group and collect every exit status before stopping the server.
          (
            set -e
            node scripts/check-internal-demo-rewrites.mjs
            node scripts/qa-turnkey.mjs
            node scripts/qa-client-interactions.mjs
            npx tsx scripts/qa-site-studio.ts
            node scripts/qa-campaign-duplicate.mjs
            node scripts/qa-delivery-handoff.mjs
            node scripts/qa-leads-bulk.mjs
            node scripts/qa-website-editor.mjs
            node scripts/qa-website-authoring.mjs
            node scripts/qa-analytics-workspace.mjs --demo
            node scripts/qa-radar-workspace.mjs
            node scripts/qa-operator-workspace.mjs
            node scripts/qa-today-workspace.mjs
            node scripts/qa-booking-mode.mjs
            npm run test:work-completion -- --browser-fixtures
            node scripts/qa-work-completion.mjs
          ) &
          workspace_qa_pid=$!
          (
            set -e
            DOCS_QA_URL="$PLAYWRIGHT_BASE_URL" npm run qa:docs
            node scripts/qa-work-portfolio.mjs
            node scripts/qa-public-navigation-profile.mjs --services-only
            node scripts/qa-demo-business-workflows.mjs
          ) &
          public_qa_pid=$!
          (
            set -e
            node scripts/qa-social-marketing.mjs
            node scripts/qa-collections-workspace.mjs
            node scripts/qa-universal-work-board.mjs
            polish_status=0
            for polish_suite in qa-admin-polish qa-admin-polish-interactions qa-admin-polish-touch qa-admin-polish-theme-editor qa-admin-polish-navigation qa-admin-overhaul; do
              if ! node "scripts/${polish_suite}.mjs"; then polish_status=1; fi
            done
            if [ "$polish_status" -ne 0 ]; then exit "$polish_status"; fi
            node scripts/qa-contact-review-copy.mjs
            node scripts/qa-demo-marketing.mjs
            node scripts/qa-theme-persistence.mjs
          ) &
          admin_qa_pid=$!
          browser_status=0
          for browser_pid in "$workspace_qa_pid" "$public_qa_pid" "$admin_qa_pid"; do
            if ! wait "$browser_pid"; then browser_status=1; fi
          done
          exit "$browser_status"
      - name: Retain first-run browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: credential-free-browser-evidence
          path: |
            /tmp/accelerate-social-qa/
            /tmp/accelerate-site-studio-qa/
            /tmp/accelerate-website-editor/
            /tmp/accelerate-website-authoring/
            /tmp/accelerate-campaign-duplicate/
            /tmp/accelerate-delivery-handoff/
            /tmp/accelerate-leads-bulk/
            /tmp/accelerate-turnkey-qa/
            /tmp/accelerate-work-completion/
            /tmp/accelerate-demo-business/
            /tmp/accelerate-docs-takeover-qa/
            /tmp/accelerate-work-portfolio-qa/
            /tmp/accelerate-public-navigation-profile/
            /tmp/accelerate-collections-workspace/
            /tmp/accelerate-analytics-workspace/
            /tmp/accelerate-radar-workspace/
            /tmp/accelerate-operator-workspace/
            /tmp/accelerate-work-board-qa/
            /tmp/accelerate-booking-mode/
            /tmp/accelerate-first-run-server.log
            /tmp/admin-polish-qa/
            /tmp/accelerate-client-interactions/
            /tmp/accelerate-admin-language/
            /tmp/accelerate-contact-review/
            /tmp/accelerate-demo-marketing/
            /tmp/accelerate-theme-persistence/
          if-no-files-found: ignore
          retention-days: 7

  neutral-starter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Export one actual neutral starter from the exact checkout
        run: node scripts/export-neutral-starter.mjs --output "$RUNNER_TEMP/neutral-starter"
      - name: Install fresh artifact dependencies and verify rendered identity
        working-directory: ${{ runner.temp }}/neutral-starter
        env:
          NEXT_PUBLIC_DISTRIBUTION_PROFILE: neutral
        run: |
          npm ci
          npx tsx scripts/test-neutral-starter-artifact.ts
      - name: Build the exported starter with its own fresh source history
        working-directory: ${{ runner.temp }}/neutral-starter
        run: |
          git init --quiet
          git add .
          git -c user.name="Neutral Starter CI" -c user.email="neutral-ci@example.com" commit --quiet -m "Verify exported neutral source"
          npm run build
      - name: Verify actual neutral desktop and mobile journeys
        working-directory: ${{ runner.temp }}/neutral-starter
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3024
        run: |
          npx playwright install --with-deps chromium
          setsid npm run start -- --hostname localhost --port 3024 > /tmp/accelerate-neutral-server.log 2>&1 &
          server_pid=$!
          trap 'kill -TERM -- -"$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$PLAYWRIGHT_BASE_URL" > /dev/null; then ready=true; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/accelerate-neutral-server.log; exit 1; fi
          node scripts/qa-turnkey.mjs --neutral
      - name: Retain exact neutral artifact and browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: neutral-starter-evidence
          path: |
            ${{ runner.temp }}/neutral-starter/neutral-starter-receipt.json
            /tmp/accelerate-neutral-qa/
            /tmp/accelerate-neutral-server.log
          if-no-files-found: ignore
          retention-days: 7

  # Keep the existing required check name and fail if either job fails or skips.
  verify:
    if: ${{ always() }}
    needs: [checks, build, neutral-starter]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all verification jobs
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          NEUTRAL_RESULT: ${{ needs.neutral-starter.result }}
        run: test "$CHECKS_RESULT" = success && test "$BUILD_RESULT" = success && test "$NEUTRAL_RESULT" = success
