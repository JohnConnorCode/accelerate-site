name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focus-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exercise the exact release shared owners
        env:
          QA_FOCUS_BASELINE_REF: c2b090e51ec74c0433d368adde9c150686686b2f
        run: |
          mkdir -p /tmp/accelerate-admin-focus-handoff
          set -o pipefail
          node scripts/qa-admin-focus-handoff.mjs 2>&1 | tee /tmp/accelerate-admin-focus-handoff/runner.log
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: release-focus-diagnostic
          path: /tmp/accelerate-admin-focus-handoff/
          if-no-files-found: warn
