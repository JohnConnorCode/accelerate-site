name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focus-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_DISTRIBUTION_PROFILE: branded
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:qa
      - name: Exercise the corrected release admin journey
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3018
        run: |
          mkdir -p /tmp/accelerate-full-admin-demo
          set -o pipefail
          setsid npm run start:qa -- --hostname localhost --port 3018 > /tmp/accelerate-full-admin-demo/server.log 2>&1 &
          server_pid=$!
          trap 'kill -TERM -- -"$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$PLAYWRIGHT_BASE_URL/roadmap" > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/accelerate-full-admin-demo/server.log; exit 1; fi
          node scripts/qa-admin-demo.mjs --one 2>&1 | tee /tmp/accelerate-full-admin-demo/runner.log
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: release-admin-diagnostic
          path: /tmp/accelerate-full-admin-demo/
          if-no-files-found: warn
