name: CI

on:
  workflow_dispatch:
    inputs:
      cold_start_only:
        description: Verify installation, fork deployment and first-use journeys
        type: boolean
        default: false
      public_pages_only:
        description: Verify public pages and docs without repeating unrelated workspace suites
        type: boolean
        default: false
      admin_design_only:
        description: Capture admin appearance evidence without the full CI suite
        type: boolean
        default: false
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Superseded PR runs can stop. Merge-queue/main receipts remain SHA-specific.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect docs-only pull request
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || ! git diff --no-renames --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files" || [ ! -s "$RUNNER_TEMP/changed-files" ]; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              'src/app/(marketing)/docs/'*|src/components/docs/*|src/content/docs/*|src/lib/docs.ts|scripts/qa-docs.ts|public/images/docs/*|public/docs-llms.txt) ;;
              *) echo 'docs_only=false' >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          echo 'docs_only=true' >> "$GITHUB_OUTPUT"

  checks:
    needs: scope
    if: ${{ !inputs.admin_design_only && !inputs.public_pages_only && !inputs.cold_start_only && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: dependencies
        run: npm ci

      - name: Verify repository hygiene
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:oss

      - name: Verify architecture contract
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:agent-contract

      - name: Verify admin AI operation inventory
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node --test scripts/test-admin-ai-inventory.mjs
          node scripts/admin-ai-inventory.mjs --check

      - name: Verify admin route inventory
        run: npm run test:admin-route-inventory

      - name: Verify copy guardrails
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:guardrails

      - name: Verify no fabricated claims
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:no-fabricated-claims

      - name: Verify house style (no em dashes)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:house-style-copy

      - name: Verify open-source page stats match the repo
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:open-source-stats

      - name: Verify full-product neutral fork and connected website forms
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:full-product-fork

      - name: Verify admin design token contract
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:admin-tokens

      - name: Verify docs manifest and prose contract
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:docs

      - name: Verify documentation coverage failure cases
        run: npm run test:docs-coverage

      - name: Verify generated docs llms index is current
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run docs:llms:check

      - name: Verify extension manifests are in sync
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:extensions

      - name: Verify module contract resolves
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:module-contract

      - name: Verify module-owned API routes gate by module
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:module-route-guards

      - name: Verify integration adapters resolve through the registry
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:integration-adapter-encapsulation

      - name: Verify capabilities cannot reach a raw database handle
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:capability-isolation

      - name: Verify module settings never look like secrets
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:module-settings

      - name: Verify runtime tenant and domain boundaries
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          npm run verify:runtime-boundaries
          node --test scripts/test-runtime-error-adoption.mjs

      - name: Verify admin language and route identity
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node scripts/audit-admin-language.mjs --check
          node --import tsx scripts/test-admin-language.ts

      - name: Lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run lint -- --max-warnings=0

      - name: Typecheck all application and test sources
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npx tsc --noEmit

      - name: Check formatting
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run format:check

      - name: Verify documentation search
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:search

      - name: Verify shared navigation contracts
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npx tsx scripts/test-navigation-runtime.ts

      - name: Run core contract suite
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:core

      - name: Measure independent cold plugin evaluations
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          git fetch --no-tags --depth=1 origin 318b11dd00e91043a1218d34766442e778ac0dfc
          npm run test:plugin-cold-start -- --baseline-ref 318b11dd00e91043a1218d34766442e778ac0dfc --output /tmp/plugin-cold-start.json

      - name: Retain all cold-start samples
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-cold-start-measurements
          path: /tmp/plugin-cold-start.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify guided installation contracts
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:setup-status

      - name: Verify fresh-fork install runbook
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:install-runbook

      - name: Verify neutral fork distribution
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:neutral-runtime-distribution && node scripts/test-neutral-export.mjs

      - name: Retain install-runbook receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: install-runbook-receipt
          path: /tmp/accelerate-install-runbook.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify real command-agent orchestration
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:agent-loop

      - name: Verify runtime PostgreSQL concurrency and migrations
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
          PATH="$(pg_config --bindir):$PATH" npm run test:tenant-lifecycle:postgres
          PATH="$(pg_config --bindir):$PATH" npm run test:conversational-agent:postgres
          PATH="$(pg_config --bindir):$PATH" npm run test:runtime-postgres
          PATH="$(pg_config --bindir):$PATH" npm run test:phase-b-proof:postgres
          PATH="$(pg_config --bindir):$PATH" npm run test:work-completion:postgres
          PATH="$(pg_config --bindir):$PATH" npm run test:workspace-configuration:postgres
          PATH="$(pg_config --bindir):$PATH" npm run test:connected-learning
          PATH="$(pg_config --bindir):$PATH" npm run test:learning-proposals:postgres
          PATH="$(pg_config --bindir):$PATH" npm run test:ai-readiness
          PATH="$(pg_config --bindir):$PATH" npm run test:work-board-resume
          PATH="$(pg_config --bindir):$PATH" npm run test:today-workspace
          npm run test:form-builder
          npm run test:site-editor
          npm run test:workspace-mcp-oauth
          PATH="$(pg_config --bindir):$PATH" npm run test:form-builder:postgres
          PATH="$(pg_config --bindir):$PATH" npm run test:site-editor:postgres

      - name: Verify Social Marketing adapter and publication transactions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          npm run test:social-postiz
          PATH="$(pg_config --bindir):$PATH" npm run test:social-postgres

      - name: Verify installation migrations
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          npm run verify:migrations
          PATH="$(pg_config --bindir):$PATH" npm run test:migration-ledger
          PATH="$(pg_config --bindir):$PATH" npm run test:cold-start:postgres
          npm run test:public-roadmap

      - name: Verify complete reference business journeys
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: PATH="$(pg_config --bindir):$PATH" npm run test:reference-business-journeys

      - name: Upload reference journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-business-journeys
          path: /tmp/accelerate-reference-journeys-*/
          if-no-files-found: warn

      - name: Verify developer handoff and fresh-clone pickup
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          npm run test:developer-handoff
          npm run test:agent-checkpoint
          npm run test:agent-workflow-friction
          npm run test:command-center-pwa
          NODE_OPTIONS=--conditions=react-server node --import tsx scripts/test-demo-work-continuity.ts

      - name: Verify resource gate behavior
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:resources

      - name: Verify commit workflow behavior
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:verification-workflow

      - name: Verify canonical stage history
        run: |
          NODE_OPTIONS=--conditions=react-server node --import tsx scripts/test-stage-history-analytics.ts
          npm run test:analytics-decision-model

  docs-checks:
    needs: scope
    if: ${{ needs.scope.outputs.docs_only == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:docs
      - run: npm run test:docs-coverage
      - run: npm run docs:llms:check
      - run: npm run test:search
      - run: npm run test:no-fabricated-claims
      - run: npm run test:house-style-copy
      - run: npm run lint -- --max-warnings=0
      - run: npm run format:check

  build:
    needs: scope
    if: ${{ !inputs.admin_design_only && !inputs.cold_start_only }}
    runs-on: ubuntu-latest
    # Full browser coverage can take 30 minutes. Leave time for browser
    # installation, the production build and evidence uploads as well.
    timeout-minutes: 60
    env:
      # Preserve explicit coverage for the original agency installation.
      NEXT_PUBLIC_DISTRIBUTION_PROFILE: branded
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore Next.js compiler cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-
      # next build includes TypeScript validation. Never ignore build errors.
      - name: Build and typecheck
        id: production_build
        run: npm run build

      # A public-only verification can supply a local production preview when
      # the development machine cannot safely run another compiler.
      - name: Retain local production preview
        if: ${{ inputs.public_pages_only }}
        uses: actions/upload-artifact@v7
        with:
          name: local-production-preview
          path: |
            .next/
            !.next/cache/
            !.next/diagnostics/
          include-hidden-files: true
          retention-days: 2

      - name: Verify compiled document extraction
        if: ${{ needs.scope.outputs.docs_only != 'true' }}
        run: NODE_OPTIONS=--conditions=react-server npx tsx scripts/test-document-extraction.ts --compiled

      - name: Verify complete built documentation coverage
        run: npm run verify:public-prerender

      - name: Verify strict docs coverage
        if: ${{ needs.scope.outputs.docs_only == 'true' }}
        run: npm run verify:docs -- --strict

      - name: Verify deployable plugin engine package
        if: ${{ needs.scope.outputs.docs_only != 'true' }}
        run: node scripts/check-plugin-host-package.mjs

      - name: Install browser for first-run verification
        id: browser_install
        run: npx playwright install --with-deps chromium webkit
      - name: Verify native homepage and cached mobile motion
        if: ${{ needs.scope.outputs.docs_only != 'true' }}
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3018
        run: |
          setsid npm run start -- --hostname localhost --port 3018 > /tmp/accelerate-mobile-motion-server.log 2>&1 &
          server_pid=$!
          trap 'kill -TERM -- -"$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$PLAYWRIGHT_BASE_URL/roadmap" > /dev/null; then ready=true; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/accelerate-mobile-motion-server.log; exit 1; fi
          hero_status=0
          mobile_status=0
          loading_status=0
          node scripts/qa-home-hero-timing.mjs || hero_status=$?
          node scripts/qa-mobile-motion.mjs --webkit || mobile_status=$?
          node scripts/qa-public-loading.mjs || loading_status=$?
          test "$hero_status" -eq 0 && test "$mobile_status" -eq 0 && test "$loading_status" -eq 0
      - name: Retain native mobile motion evidence
        if: ${{ always() && needs.scope.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: mobile-motion-browser-evidence
          path: |
            /tmp/accelerate-home-hero-timing/
            /tmp/accelerate-mobile-motion/
            /tmp/accelerate-public-loading/
            /tmp/accelerate-mobile-motion-server.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify Leads partial writes and recovery
        if: ${{ needs.scope.outputs.docs_only != 'true' && !inputs.public_pages_only }}
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3018
          LEAD_QA_OUTPUT: /tmp/accelerate-leads-write-recovery
        run: |
          setsid npm run start -- --hostname localhost --port 3018 > /tmp/accelerate-leads-server.log 2>&1 &
          server_pid=$!
          trap 'kill -TERM -- -"$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$PLAYWRIGHT_BASE_URL/roadmap" > /dev/null; then ready=true; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/accelerate-leads-server.log; exit 1; fi
          npm run qa:lead-write-recovery
      - name: Retain Leads recovery evidence
        if: ${{ always() && needs.scope.outputs.docs_only != 'true' && !inputs.public_pages_only }}
        uses: actions/upload-artifact@v7
        with:
          name: leads-write-recovery-evidence
          path: /tmp/accelerate-leads-write-recovery/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify Revenue reporting and recovery
        if: ${{ !inputs.public_pages_only && needs.scope.outputs.docs_only != 'true' }}
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3018
        run: |
          setsid npm run start -- --hostname localhost --port 3018 > /tmp/accelerate-revenue-server.log 2>&1 &
          server_pid=$!
          trap 'kill -TERM -- -"$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$PLAYWRIGHT_BASE_URL/roadmap" > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/accelerate-revenue-server.log; exit 1; fi
          npm run qa:revenue
      - name: Retain Revenue browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: revenue-browser-evidence
          path: /tmp/accelerate-revenue-qa/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify industry and Chicago release pages
        if: ${{ needs.scope.outputs.docs_only != 'true' }}
        run: node scripts/qa-chicago-industries.mjs
      - name: Retain industry and Chicago browser evidence
        if: ${{ always() && needs.scope.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: industry-chicago-browser-evidence
          path: /tmp/accelerate-chicago-qa/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify workspace configuration approvals
        if: ${{ !inputs.public_pages_only && needs.scope.outputs.docs_only != 'true' }}
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3018
        run: |
          setsid npm run start -- --hostname localhost --port 3018 > /tmp/accelerate-configuration-server.log 2>&1 &
          server_pid=$!
          trap 'kill -- -"$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$PLAYWRIGHT_BASE_URL/demo/command-center" > /dev/null; then ready=true; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat /tmp/accelerate-configuration-server.log; exit 1; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/accelerate-configuration-server.log; exit 1; fi
          npm run resources:run -- node scripts/qa-workspace-configuration.mjs

      - name: Retain workspace configuration evidence
        if: ${{ always() && !inputs.public_pages_only && needs.scope.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: workspace-configuration-evidence
          path: |
            /tmp/accelerate-workspace-configuration/
            /tmp/accelerate-configuration-server.log

      - name: Verify credential-free first-run journey
        # Collect independent journeys after another browser suite fails, while
        # preserving that failure in the required overall CI result.
        if: ${{ !cancelled() && steps.production_build.outcome == 'success' && steps.browser_install.outcome == 'success' }}
        env:
          # NextURL canonicalizes loopback IPs to localhost. Keep the server's
          # initURL on that same origin so demo rewrites never become self-proxies.
          PUBLIC_PAGES_ONLY: ${{ inputs.public_pages_only }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          PLAYWRIGHT_BASE_URL: http://localhost:3018
        run: |
          setsid npm run start -- --hostname localhost --port 3018 > /tmp/accelerate-first-run-server.log 2>&1 &
          server_pid=$!
          trap 'kill -TERM -- -"$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$PLAYWRIGHT_BASE_URL/roadmap" > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/accelerate-first-run-server.log; exit 1; fi
          # Each browser owns isolated contexts and fictional session state.
          # Run every group and collect every exit status before stopping the server.
          (
            set -e
            if [ "$PUBLIC_PAGES_ONLY" = "true" ] || [ "$DOCS_ONLY" = "true" ]; then exit 0; fi
            node scripts/check-internal-demo-rewrites.mjs
            node scripts/qa-turnkey.mjs
            node scripts/qa-client-interactions.mjs
            npx tsx scripts/qa-site-studio.ts
            node scripts/qa-campaign-duplicate.mjs
            node scripts/qa-delivery-handoff.mjs
            node scripts/qa-leads-bulk.mjs
            node scripts/qa-website-editor.mjs
            node scripts/qa-website-authoring.mjs
            node scripts/qa-analytics-workspace.mjs --demo
            node scripts/qa-radar-workspace.mjs
            node scripts/qa-command-center-offline-store.mjs
            node scripts/qa-operator-workspace.mjs
            node scripts/qa-today-workspace.mjs
            node scripts/qa-booking-mode.mjs
            npm run test:work-completion -- --browser-fixtures
            node scripts/qa-work-completion.mjs
          ) &
          workspace_qa_pid=$!
          (
            set -e
            DOCS_QA_URL="$PLAYWRIGHT_BASE_URL" npm run qa:docs
            if [ "$DOCS_ONLY" = "true" ]; then exit 0; fi
            node scripts/qa-conversational-agent.mjs
            node scripts/qa-proposal-public-decisions.mjs
            node scripts/qa-work-portfolio.mjs
            node scripts/qa-invoice-navigation.mjs
            node scripts/qa-home-polish.mjs
            node scripts/qa-demo-business-workflows.mjs
          ) &
          public_qa_pid=$!
          (
            set -e
            if [ "$PUBLIC_PAGES_ONLY" = "true" ] || [ "$DOCS_ONLY" = "true" ]; then exit 0; fi
            node scripts/qa-social-marketing.mjs
            node scripts/qa-collections-workspace.mjs
            node scripts/qa-universal-work-board.mjs
            polish_status=0
            for polish_suite in qa-admin-polish qa-admin-polish-interactions qa-admin-polish-touch qa-admin-polish-theme-editor qa-admin-polish-navigation qa-admin-overhaul; do
              if ! node "scripts/${polish_suite}.mjs"; then polish_status=1; fi
            done
            if [ "$polish_status" -ne 0 ]; then exit "$polish_status"; fi
            node scripts/qa-contact-review-copy.mjs
            node scripts/qa-demo-marketing.mjs
            node scripts/qa-theme-persistence.mjs
          ) &
          admin_qa_pid=$!
          browser_status=0
          for browser_pid in "$workspace_qa_pid" "$public_qa_pid" "$admin_qa_pid"; do
            if ! wait "$browser_pid"; then browser_status=1; fi
          done
          # Measure navigation performance without competing browser suites on
          # this runner. Keep the same 200ms limit and retain failure evidence.
          if [ "$DOCS_ONLY" != "true" ]; then
            if ! node scripts/qa-public-navigation-profile.mjs --services-only; then browser_status=1; fi
          fi
          if [ "$PUBLIC_PAGES_ONLY" != "true" ] && [ "$DOCS_ONLY" != "true" ]; then
            if ! node scripts/qa-contact-import-source-review.mjs; then browser_status=1; fi
            if ! node scripts/qa-collection-policy.mjs; then browser_status=1; fi
          fi
          exit "$browser_status"
      - name: Retain permissions guide browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: permissions-guide-browser-evidence
          path: |
            /tmp/accelerate-docs-takeover-qa/*-_docs_self-hosting_permissions.png
            /tmp/accelerate-docs-takeover-qa/results.json
          if-no-files-found: error
          retention-days: 7

      - name: Retain first-run browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: credential-free-browser-evidence
          path: |
            /tmp/accelerate-proposal-decisions/
            /tmp/accelerate-social-qa/
            /tmp/accelerate-site-studio-qa/
            /tmp/accelerate-website-editor/
            /tmp/accelerate-website-authoring/
            /tmp/accelerate-campaign-duplicate/
            /tmp/accelerate-delivery-handoff/
            /tmp/accelerate-leads-bulk/
            /tmp/accelerate-turnkey-qa/
            /tmp/accelerate-work-completion/
            /tmp/accelerate-demo-business/
            /tmp/accelerate-invoice-navigation/
            /tmp/accelerate-docs-takeover-qa/
            /tmp/accelerate-work-portfolio-qa/
            /tmp/accelerate-public-navigation-profile/
            /tmp/accelerate-home-hero-timing/
            /tmp/accelerate-mobile-motion/
            /tmp/accelerate-home-polish/
            /tmp/accelerate-collections-workspace/
            /tmp/accelerate-analytics-workspace/
            /tmp/accelerate-radar-workspace/
            /tmp/accelerate-operator-workspace/
            /tmp/accelerate-work-board-qa/
            /tmp/accelerate-booking-mode/
            /tmp/accelerate-conversational-agent/
            /tmp/accelerate-first-run-server.log
            /tmp/admin-polish-qa/
            /tmp/accelerate-client-interactions/
            /tmp/accelerate-admin-language/
            /tmp/accelerate-contact-review/
            /tmp/accelerate-demo-marketing/
            /tmp/accelerate-theme-persistence/
            /tmp/accelerate-import-source-review/
            /tmp/accelerate-policy-browser/
          if-no-files-found: ignore
          retention-days: 7

  full-product-fork:
    needs: scope
    if: ${{ !inputs.admin_design_only && !inputs.public_pages_only && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [missing, example]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify onboarding contracts and native installation
        if: ${{ inputs.cold_start_only && matrix.configuration == 'missing' }}
        run: |
          npm run verify:agent-contract
          npm run lint
          npm run test:setup-status
          npm run test:install-runbook
          npm run verify:docs
          npm run docs:llms:check
          npm run test:search
          npm run test:developer-handoff
          PATH="$(pg_config --bindir):$PATH" npm run resources:run -- npm run test:cold-start:postgres
      - name: Use an unchanged copied example
        if: ${{ matrix.configuration == 'example' }}
        run: cp .env.example .env.local
      # Both absent configuration and the copied example must remain explorable.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run resources:run -- node scripts/qa-full-product-fork.mjs
      - name: Retain full-product fork evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: full-product-fork-evidence-${{ matrix.configuration }}
          path: |
            /tmp/accelerate-full-product-fork-qa/
            /tmp/accelerate-cold-install-postgres.json
          if-no-files-found: ignore
          retention-days: 7

  neutral-starter:
    needs: scope
    if: ${{ !inputs.admin_design_only && !inputs.public_pages_only && !inputs.cold_start_only && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Export one actual neutral starter from the exact checkout
        run: node scripts/export-neutral-starter.mjs --output "$RUNNER_TEMP/neutral-starter"
      - name: Install fresh artifact dependencies and verify rendered identity
        working-directory: ${{ runner.temp }}/neutral-starter
        env:
          NEXT_PUBLIC_DISTRIBUTION_PROFILE: neutral
        run: |
          npm ci
          npx tsx scripts/test-neutral-starter-artifact.ts
      - name: Build the exported starter with its own fresh source history
        working-directory: ${{ runner.temp }}/neutral-starter
        run: |
          git init --quiet
          git add .
          git -c user.name="Neutral Starter CI" -c user.email="neutral-ci@example.com" commit --quiet -m "Verify exported neutral source"
          npm run build
      - name: Verify actual neutral desktop and mobile journeys
        working-directory: ${{ runner.temp }}/neutral-starter
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3024
        run: |
          npx playwright install --with-deps chromium
          setsid npm run start -- --hostname localhost --port 3024 > /tmp/accelerate-neutral-server.log 2>&1 &
          server_pid=$!
          trap 'kill -TERM -- -"$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$PLAYWRIGHT_BASE_URL" > /dev/null; then ready=true; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/accelerate-neutral-server.log; exit 1; fi
          node scripts/qa-turnkey.mjs --neutral
      - name: Retain exact neutral artifact and browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: neutral-starter-evidence
          path: |
            ${{ runner.temp }}/neutral-starter/neutral-starter-receipt.json
            /tmp/accelerate-neutral-qa/
            /tmp/accelerate-neutral-server.log
          if-no-files-found: ignore
          retention-days: 7

  # Keep the required check name; accept only the jobs expected for the detected scope.
  verify:
    if: ${{ always() && !inputs.admin_design_only && !inputs.public_pages_only && !inputs.cold_start_only }}
    needs: [scope, checks, docs-checks, build, full-product-fork, neutral-starter]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all verification jobs
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          DOCS_CHECKS_RESULT: ${{ needs.docs-checks.result }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          NEUTRAL_RESULT: ${{ needs.neutral-starter.result }}
          FULL_FORK_RESULT: ${{ needs.full-product-fork.result }}
        run: |
          test "$SCOPE_RESULT" = success && test "$BUILD_RESULT" = success || exit 1
          if [ "$DOCS_ONLY" = true ]; then
            test "$DOCS_CHECKS_RESULT" = success && test "$CHECKS_RESULT" = skipped && test "$NEUTRAL_RESULT" = skipped && test "$FULL_FORK_RESULT" = skipped || exit 1
          else
            test "$DOCS_ONLY" = false && test "$CHECKS_RESULT" = success && test "$DOCS_CHECKS_RESULT" = skipped && test "$NEUTRAL_RESULT" = success && test "$FULL_FORK_RESULT" = success || exit 1
          fi

  admin-design:
    if: ${{ inputs.admin_design_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify themes and token compatibility
        run: |
          npm run test:admin-themes
          npm run verify:admin-tokens
          node --check scripts/qa-admin-core.mjs
      - name: Verify representative core routes
        env:
          QA_ROUTES: today,features,contacts,settings,integrations
          QA_SKIP_PREVIEW: "1"
          QA_OUTPUT: /tmp/admin-core-qa/routes
        run: npm run qa:admin-core
      - name: Capture nine theme identities and keyboard interaction
        env:
          QA_ROUTES: today
          QA_OUTPUT: /tmp/admin-core-qa/identities
        run: npm run qa:admin-core
      - name: Retain visual evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: admin-design-evidence
          path: /tmp/admin-core-qa/
          if-no-files-found: ignore
          retention-days: 7
