name: accelerate
services:
  app:
    build:
      context: .
      args:
        APP_REVISION: ${APP_REVISION:?Run npm run stack:up}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SITE_URL: https://${APP_HOST:?Set APP_HOST in .env}
    env_file: .env
    environment:
      NEXT_PUBLIC_SITE_URL: https://${APP_HOST}
      POSTIZ_ORIGIN: https://${POSTIZ_HOST:?Run npm run stack:up}
    restart: unless-stopped
  proxy:
    extends: { file: plugins/social-marketing/deployment/compose.yaml, service: proxy }
    environment:
      APP_HOST: ${APP_HOST}
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./plugins/social-marketing/deployment/Caddyfile:/etc/caddy/postiz.caddy:ro
    depends_on: [app, postiz]
  postiz:
    extends: { file: plugins/social-marketing/deployment/compose.yaml, service: postiz }
    build:
      context: ./plugins/social-marketing/deployment/upstream
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_VERSION: accelerate-3cbe20b-2
  postgres:
    extends: { file: plugins/social-marketing/deployment/compose.yaml, service: postgres }
  redis:
    extends: { file: plugins/social-marketing/deployment/compose.yaml, service: redis }
  temporal-db:
    extends: { file: plugins/social-marketing/deployment/compose.yaml, service: temporal-db }
  temporal:
    extends: { file: plugins/social-marketing/deployment/compose.yaml, service: temporal }
volumes:
  postiz-db:
  postiz-config:
  postiz-uploads:
  redis-data:
  temporal-db:
  caddy-data:
  caddy-config:
